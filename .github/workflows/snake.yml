name: Generate Snake

on:
  schedule:
    # execute every 12 hours
    - cron: "0 */12 * * *"
  
  # run automatically on push to main
  push:
    branches:
      - main
  
  # allows to manually run the job at any time
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=magenta&color_dots=#ebedf0,#fbcfe8,#f472b6,#db2777,#9d174d
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=magenta&color_dots=#170e28,#8b5cf6,#c084fc,#e879f9,#ff7eb6

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
